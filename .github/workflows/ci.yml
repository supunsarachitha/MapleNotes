name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test and license check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/maple-web/package-lock.json

      - name: Server — build and test
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet test --no-build

      - name: Web app — typecheck, test and build
        working-directory: src/maple-web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Dependency licenses
        run: python3 scripts/check-licenses.py

  container:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-24.04
    needs: test
    # Pull requests only build the image; pushes to main and tags also publish it to GitHub's container registry
    # (ghcr.io/supunsarachitha/maplenotes), which the Portainer stack in deploy/ pulls.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/maplenotes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
