name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test and license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/maple-web/package-lock.json

      - name: Server — build and test
        run: |
          dotnet restore
          dotnet build --no-restore
          dotnet test --no-build

      - name: Web app — typecheck, test and build
        working-directory: src/maple-web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Dependency licenses
        run: python3 scripts/check-licenses.py

  container:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: maple-notes:ci
