name: Website

# Publishes site/ to GitHub Pages (https://supunsarachitha.github.io/MapleNotes/) whenever it changes on main.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - src/maple-web/public/favicon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the website
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The icon and screenshots come from the app and the README, so the site always shows the current ones.
      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -R site/. _site/
          cp src/maple-web/public/favicon.svg _site/
          cp docs/screenshots/*.png _site/screenshots/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
