name: Secret scanning

# Runs gitleaks on the new commit range (PR commits or pushed range) so that
# existing test fixtures with example keys do not block builds. The gitleaks
# binary is downloaded from its official GitHub release, pinned to v8.30.1, and
# verified against its sha256 checksum.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history so the PR commit range is available.
          fetch-depth: 0

      - name: Determine commit range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "COMMIT_RANGE=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            # push event: range from the previous push to this commit
            echo "COMMIT_RANGE=${{ github.event.before }}..${{ github.event.after }}" >> "$GITHUB_ENV"
          fi

      - name: Download gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz
          ./gitleaks version

      - name: Scan new commits
        run: |
          ./gitleaks git "${GITHUB_WORKSPACE}" --log-opts="${COMMIT_RANGE}" --redact
